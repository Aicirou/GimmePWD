<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GimmePWD - Weaponized randomness</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300F5A0'%3E%3Cpath d='M12 2C9.24 2 7 4.24 7 7v3H6c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-8c0-1.1-.9-2-2-2h-1V7c0-2.76-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3v3H9V7c0-1.66 1.34-3 3-3zm0 10c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Interactive Background Physics Canvas -->
  <canvas id="bgCanvas"></canvas>

  <!-- Ambient Atmospheric Glow Orbs -->
  <div class="ambient-glow orb-1" aria-hidden="true"></div>
  <div class="ambient-glow orb-2" aria-hidden="true"></div>

  <!-- Top Floating Toolbar -->
  <header class="top-nav">
    <div class="nav-brand">
      <span class="brand-dot"></span>
      <span class="brand-text">GimmePWD</span>
    </div>
    <div class="nav-controls">
      <span class="kb-hint"><kbd>Space</kbd> Generate &bull; <kbd>Enter</kbd> Copy</span>
      <button id="soundToggle" class="icon-toggle" aria-label="Toggle Sound" title="Toggle sound">
        <svg class="sound-on-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <svg class="sound-off-icon" style="display:none" viewBox="0 0 24 24" width="18" height="18" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Glassmorphism Card with 3D Tilt -->
  <main id="container" class="glass-card card-entrance" role="region" aria-label="Password Generator Card">
    <!-- Luminous Animated Conic Border Beam -->
    <div class="card-border-beam" aria-hidden="true"></div>
    <div class="card-glow-border" aria-hidden="true"></div>

    <!-- Title with Original Personality -->
    <h1 id="title">
      <span class="title-sub">Gimme a</span>
      <span class="title-color">random PWD</span><span id="question-mark" title="fuk uuu!">...?</span>
    </h1>
    <p class="tagline">Generate, copy, and get on with your life.</p>

    <!-- Password Output Field -->
    <div class="password-wrapper" id="passwordWrapper">
      <div id="password" role="button" tabindex="0" title="Click to copy"
        aria-label="Generated password. Click to copy."></div>
      <div class="copy-badge" id="copyBadge">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span id="copyBadgeText">COPIED</span>
      </div>
    </div>

    <!-- Controls: Length Slider & Entropy -->
    <div class="controls-row">
      <div class="slider-group">
        <div class="slider-header">
          <label for="lengthSlider" class="slider-label">Length</label>
          <span class="slider-value" id="lengthDisplay">21</span>
        </div>
        <div class="slider-wrapper">
          <input type="range" id="lengthSlider" min="8" max="40" value="21" step="1" aria-label="Password length" />
        </div>
      </div>

      <div class="entropy-meter" id="entropyMeter">
        <div class="entropy-bar-track">
          <div class="entropy-bar-fill" id="entropyFill"></div>
        </div>
        <span class="entropy-text" id="entropyText">135-bit &bull; Quantum Resistant</span>
      </div>
    </div>

    <!-- Character Breakdown Statistics -->
    <div class="stats-row">
      <div id="countTypes" class="badges-container" aria-live="polite"></div>
    </div>

    <!-- Action Button Group -->
    <div class="actions-row">
      <button id="refreshButton" class="btn-refresh" title="Re-roll (Space)" aria-label="Generate new password">
        <svg class="refresh-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" />
        </svg>
        <span class="btn-label">Re-roll</span>
      </button>

      <button id="copyButton" class="btn-copy" title="Copy (Enter)" aria-label="Copy password to clipboard">
        <svg class="copy-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span id="copyBtnText">Copy</span>
      </button>
    </div>

    <div id="copyMessage" class="status-toast" hidden></div>
  </main>

  <script src="script.js"></script>
</body>

</html>
